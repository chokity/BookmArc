<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BookmArc</title>
  <link rel="stylesheet" href="sidebar.css">
  <script src="../shared/tint.js"></script>
</head>
<body class="booting">
  <label class="search">
    <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m10.5 10.5 3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <input id="search" type="search" placeholder="Search bookmarks" autocomplete="off" spellcheck="false" aria-label="Search bookmarks and tabs">
    <button id="search-clear" type="button" class="icon-btn search-clear" title="Clear search" aria-label="Clear search" hidden>
      <svg viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </label>

  <section id="favorites" class="fav-grid empty" aria-label="Favorites"></section>

  <header id="space-head" class="space-head" title="Your bookmarks bar · click to show or hide">
    <span class="chevron" aria-hidden="true">
      <svg viewBox="0 0 16 16"><path d="m6 3.5 4.5 4.5L6 12.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
    <span class="space-title">Bookmarks</span>
    <button id="space-more" class="icon-btn space-more" title="Options">
      <svg viewBox="0 0 16 16"><circle cx="3.5" cy="8" r="1.3" fill="currentColor"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/><circle cx="12.5" cy="8" r="1.3" fill="currentColor"/></svg>
    </button>
  </header>

  <div class="scroll">
    <ul id="pinned" class="tab-list" aria-label="Pinned"></ul>

    <div class="divider-row" title="Drag to resize the pinned list, double-click to reset">
      <button id="dock-today" class="icon-btn dock-btn"></button>
      <div class="divider"></div>
      <button id="clear" class="link-btn" title="Close all open tabs that aren't pinned">↓ Clear</button>
    </div>

    <button id="new-tab" class="new-tab" title="New Tab" aria-label="New Tab">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <ul id="today" class="tab-list grow" aria-label="Tabs"></ul>
  </div>

  <footer class="status-bar">
    <span id="tab-count" class="tab-count" aria-live="polite"></span>
    <button id="close-all" type="button" class="close-all" title="Close all tabs in this window">Close All</button>
  </footer>

  <div id="menu" class="menu" role="menu" hidden></div>
  <div id="dialog" class="dialog" hidden></div>

  <script type="module" src="sidebar.js"></script>
</body>
</html>
